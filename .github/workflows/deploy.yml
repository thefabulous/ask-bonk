name: Deploy Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Enable concurrency to prevent multiple deployments at the same time
concurrency:
  group: worker-deployment
  cancel-in-progress: false # Set to true if you want to kill the running job

# The deploy only reads the repo; nothing here writes back to GitHub.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: setup node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          check-latest: true

      - name: setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Exact version: the deploy must not float to a Bun release nobody tested.
          bun-version: 1.4.4
          # Never restore a cached Bun binary (another job could have written that cache).
          no-cache: true

      # Install exactly what bun.lock pins (package-lock.json is gitignored here).
      # Without a lockfile, `npm install` re-resolved every ^range on each deploy.
      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: deploy worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          # No wranglerVersion on purpose: without it the action reuses the wrangler
          # that bun.lock installed. Setting one makes the action run `bun i wrangler@X`,
          # which re-resolves wrangler's subtree (unenv-preset, workerd, esbuild) and
          # ships a bundle that was never tested.
