name: Deploy Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Enable concurrency to prevent multiple deployments at the same time
concurrency:
  group: worker-deployment
  cancel-in-progress: false # Set to true if you want to kill the running job

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          check-latest: true

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Install exactly what bun.lock pins (package-lock.json is gitignored here).
      # Without a lockfile, `npm install` re-resolved every ^range on each deploy.
      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          wranglerVersion: '4.53.0'
